<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background-color: #f4f6f8;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
    }
    nav {
      background-color: #34495e;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin: 20px auto;
      max-width: 500px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    footer {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0; width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to the Customer Portal</h1>
  </header>

  <nav>
    <a href="#">Dashboard</a>
    <a href="#">Profile</a>
    <a href="#">Support</a>
    <a href="#">Logout</a>
  </nav>

  <main>
    <div class="card">
      <h2>Hello, Customer!</h2>
      <p>This is your portal homepage. From here you can access your account details, view services, and contact support.</p>
      <button onclick="alert('Feature coming soon!')">Explore Services</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 My Company. All rights reserved.</p>
  </footer>
</body>
</html>
